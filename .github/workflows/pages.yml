name: Deploy to GitHub Pages

on:
  push:
    # main deploys; ci/** branches run build + E2E only (the deploy job is limited to main)
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. Never cancel a run that may be mid-deploy (GitHub's recommendation for Pages);
# a ci/** run therefore cannot hold up or cancel a production deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /network-lab-studio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Every committed Playwright test must pass before the site is deployed. This job runs on its own runner:
  # Playwright's webServer builds its own dist (base "/") there, so it never touches the Pages artifact above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts already sets workers: 1 and no retries; --forbid-only fails the run if a test.only slipped in
      - run: npx playwright test --forbid-only --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/e2e-results.json
      # test counts in the run summary + a notice annotation (readable without opening the raw log)
      - name: E2E summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('e2e-results.json')) { console.log('::warning::no e2e-results.json (Playwright did not finish)'); process.exit(0); }
            const s = JSON.parse(fs.readFileSync('e2e-results.json', 'utf8')).stats;
            const line = 'E2E: ' + s.expected + ' passed, ' + s.unexpected + ' failed, ' + s.flaky + ' flaky, ' + s.skipped + ' skipped (' + Math.round(s.duration / 1000) + 's)';
            console.log('::notice title=E2E results::' + line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### ' + line + '\n');
          "
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          retention-days: 7

  # TEMPORARY gate probes (ci/r12 only, reverted before review)
  gate-probe:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/ci/r12'
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate-probe ran - this must NOT happen when e2e fails"
  gate-probe-control:
    needs: [build]
    if: github.ref == 'refs/heads/ci/r12'
    runs-on: ubuntu-latest
    steps:
      - run: echo "control ran - same condition, needs build only"

  deploy:
    needs: [build, e2e]
    # no status function here, so GitHub also requires build and e2e to have succeeded
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
