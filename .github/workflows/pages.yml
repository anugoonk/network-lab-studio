name: Deploy to GitHub Pages

on:
  push:
    # main deploys; ci/** branches run build + E2E only (the deploy job is limited to main)
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. Never cancel a run that may be mid-deploy (GitHub's recommendation for Pages);
# a ci/** run therefore cannot hold up or cancel a production deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /network-lab-studio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Every committed Playwright test must pass before the site is deployed. This job runs on its own runner:
  # Playwright's webServer builds its own dist (base "/") there, so it never touches the Pages artifact above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts already sets workers: 1 and no retries; --forbid-only fails the run if a test.only slipped in
      - run: npx playwright test --forbid-only --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/e2e-results.json
      # test counts in the run summary + a notice annotation (readable without opening the raw log)
      - name: E2E summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('e2e-results.json')) { console.log('::warning::no e2e-results.json (Playwright did not finish)'); process.exit(0); }
            const s = JSON.parse(fs.readFileSync('e2e-results.json', 'utf8')).stats;
            const line = 'E2E: ' + s.expected + ' passed, ' + s.unexpected + ' failed, ' + s.flaky + ' flaky, ' + s.skipped + ' skipped (' + Math.round(s.duration / 1000) + 's)';
            console.log('::notice title=E2E results::' + line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### ' + line + '\n');
          "
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          retention-days: 7

  # Certification-audit integrity gate (read-only verification; plain Node, no npm install, no secrets, no write access).
  # fetch-depth 0: the evidence anchors read the blob of commit 3c9aed7 (e2e/endpoint-routing.spec.ts) and the determinism
  # check rebuilds the registry from commit e23e00c; a shallow clone contains neither, and the steps then fail (never skip).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Required history is present
        run: |
          git cat-file -e 3c9aed7^{commit}
          git cat-file -e e23e00c^{commit}
      - name: Reproducibility (matrices, scores, evidence index, recompute, QC incl. anchors, MANIFEST)
        run: node certification-audit/scripts/verify.mjs
      - name: Evidence anchors resolve
        run: |
          out=$(node certification-audit/scripts/anchors.mjs check)
          echo "$out"
          case "$out" in *"anchors checked=248 problems=0"*) ;; *) echo "::error::anchor check did not report 248 anchors / 0 problems"; exit 1 ;; esac
      - name: Anchor self-tests (a SKIP is a failure)
        run: |
          out=$(node certification-audit/scripts/anchors-selftest.mjs)
          echo "$out" | tail -n 5
          if echo "$out" | grep -E '^SKIP|FAIL' ; then echo "::error::anchor self-test skipped or failed a scenario"; exit 1; fi
          echo "$out" | grep -E '^[0-9]+/[0-9]+ anchor self-tests passed$' | awk -F'[ /]' '{ if ($1 != $2 || $1 < 1) exit 1 }'
      - name: Anchor registry is deterministic (rebuilt from e23e00c, must equal data/anchors.json)
        run: |
          node certification-audit/scripts/anchors.mjs build --at e23e00c --out "$RUNNER_TEMP/anchors.rebuilt.json"
          cmp "$RUNNER_TEMP/anchors.rebuilt.json" certification-audit/data/anchors.json
      - name: Audit run left the working tree unchanged
        run: test -z "$(git status --porcelain)"

  deploy:
    # audit joins the gate: a failed certification audit also blocks a production deploy
    needs: [build, e2e, audit]
    # no status function here, so GitHub also requires build, e2e and audit to have succeeded
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
